<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clustr - Tab Manager</title>
  <link rel="stylesheet" href="manager.css">
</head>
<body>
  <div id="app">
    <!-- Header -->
    <header class="header">
      <div class="header-left">
        <div class="logo">
          <svg viewBox="0 0 24 24" width="24" height="24">
            <path fill="currentColor" d="M4 8h4V4H4v4zm6 12h4v-4h-4v4zm-6 0h4v-4H4v4zm0-6h4v-4H4v4zm6 0h4v-4h-4v4zm6-10v4h4V4h-4zm-6 4h4V4h-4v4zm6 6h4v-4h-4v4zm0 6h4v-4h-4v4z"/>
          </svg>
          <span>Clustr</span>
          <span id="appVersion"></span>
        </div>
      </div>
      
      <div class="header-center">
        <div class="search-container">
          <svg class="search-icon" viewBox="0 0 24 24" width="18" height="18">
            <path fill="currentColor" d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
          </svg>
          <input type="text" id="search" placeholder="Search tabs... (Ctrl+F)" autocomplete="off">
          <span class="search-hint" id="searchHint"></span>
        </div>
      </div>
      
      <div class="header-right">
        <span class="tab-count" id="tabCount">0 tabs</span>
        <button id="btnExport" class="header-btn" title="Export tabs">
          <svg viewBox="0 0 24 24" width="20" height="20">
            <path fill="currentColor" d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/>
          </svg>
        </button>
        <button id="btnSettings" class="header-btn" title="Settings">
          <svg viewBox="0 0 24 24" width="20" height="20">
            <path fill="currentColor" d="M19.14 12.94c.04-.31.06-.63.06-.94 0-.31-.02-.63-.06-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.04.31-.06.63-.06.94s.02.63.06.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- Main kanban area -->
    <main class="main-content">
      <div class="windows-container" id="windowsContainer">
        <!-- Windows will be rendered here -->
      </div>
      
      <!-- New window drop zone -->
      <div class="new-window-zone" id="newWindowZone">
        <svg viewBox="0 0 24 24" width="32" height="32">
          <path fill="currentColor" d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/>
        </svg>
        <span>New Window</span>
      </div>
    </main>

    <!-- Footer with sessions and recently closed -->
    <footer class="footer">
      <div class="footer-section sessions-section">
        <div class="footer-header">
          <svg viewBox="0 0 24 24" width="16" height="16">
            <path fill="currentColor" d="M20 6h-8l-2-2H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm0 12H4V8h16v10z"/>
          </svg>
          <span>Saved Sessions</span>
        </div>
        <div class="sessions-list" id="sessionsList">
          <!-- Sessions rendered here -->
        </div>
      </div>
      
      <div class="footer-divider"></div>
      
      <div class="footer-section recently-closed-section">
        <div class="footer-header">
          <svg viewBox="0 0 24 24" width="16" height="16">
            <path fill="currentColor" d="M12.5 8c-2.65 0-5.05.99-6.9 2.6L2 7v9h9l-3.62-3.62c1.39-1.16 3.16-1.88 5.12-1.88 3.54 0 6.55 2.31 7.6 5.5l2.37-.78C21.08 11.03 17.15 8 12.5 8z"/>
          </svg>
          <span>Recently Closed</span>
        </div>
        <div class="recently-closed-list" id="recentlyClosedList">
          <!-- Recently closed rendered here -->
        </div>
      </div>
    </footer>

    <!-- Modals -->
    <div id="exportModal" class="modal hidden">
      <div class="modal-backdrop" onclick="closeModal('exportModal')"></div>
      <div class="modal-content">
        <h3>Export Tabs</h3>
        <p>Export all open tabs to a file.</p>
        <div class="modal-buttons">
          <button id="exportCsv" class="btn">Export CSV</button>
          <button id="exportJson" class="btn">Export JSON</button>
        </div>
        <button onclick="closeModal('exportModal')" class="btn btn-secondary">Cancel</button>
      </div>
    </div>

    <div id="saveSessionModal" class="modal hidden">
      <div class="modal-backdrop" onclick="closeModal('saveSessionModal')"></div>
      <div class="modal-content">
        <h3>Save Session</h3>
        <p>Save this window's tabs as a reusable session.</p>
        <input type="text" id="sessionName" placeholder="Session name..." autocomplete="off">
        <div class="modal-buttons">
          <button id="confirmSaveSession" class="btn">Save</button>
          <button onclick="closeModal('saveSessionModal')" class="btn btn-secondary">Cancel</button>
        </div>
      </div>
    </div>

    <div id="settingsModal" class="modal hidden">
      <div class="modal-backdrop" onclick="closeModal('settingsModal')"></div>
      <div class="modal-content">
        <h3>Settings</h3>
        <div class="setting-row">
          <label>Theme</label>
          <select id="themeSelect">
            <option value="system">System</option>
            <option value="dark">Dark</option>
            <option value="light">Light</option>
          </select>
        </div>
        <button onclick="closeModal('settingsModal')" class="btn btn-secondary">Close</button>
      </div>
    </div>
  </div>

  <script src="manager.js"></script>
</body>
</html>
